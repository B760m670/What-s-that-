name: EAS Build

# Triggers an EAS Build (Expo cloud) on every push, producing an installable
# APK via the custom build config in .eas/build/android-apk.yml.
#
# REQUIRED ONE-TIME SETUP (done by you, never committed):
#   1. In the repo: Settings → Secrets and variables → Actions → New secret
#        name:  EXPO_TOKEN
#        value: <your Expo access token>   (rotate the one shared in chat!)
#   2. Once locally: `npx eas-cli@latest init` to create/link the Expo project
#      (writes extra.eas.projectId into app.json). Commit that change.
#      (The job also attempts this automatically below.)
on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK to a GitHub Release

jobs:
  eas-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN secret not set — skipping EAS build."
            echo "Add it under Settings → Secrets → Actions to enable this job."
            exit 0
          fi
          echo "token_present=true" >> "$GITHUB_ENV"

      - name: Set up Node
        if: env.token_present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install EAS CLI
        if: env.token_present == 'true'
        run: npm install -g eas-cli

      # Best-effort: link/create the Expo project so projectId is set. The
      # reliable path is to run `npx eas-cli@latest init` once locally and
      # commit the resulting extra.eas.projectId in app.json; then this is a
      # no-op. --force links to an existing project instead of erroring.
      - name: Ensure EAS project is initialized
        if: env.token_present == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas init --non-interactive --force || true

      # Run the EAS build and WAIT for it, capturing the build JSON so we can
      # grab the finished APK's download URL.
      - name: Build APK on EAS and capture result
        if: env.token_present == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # This is a native app with no JS dependencies — package.json is only
          # EAS project metadata — so there is no lockfile to check.
          EAS_BUILD_SKIP_LOCKFILE_CHECK: '1'
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
        run: |
          set -o pipefail
          eas build --platform android --profile production \
            --non-interactive --wait --json > build.json
          cat build.json

      # Pull the APK URL out of the build JSON (field name has varied across
      # eas-cli versions, so search recursively) and download the file.
      - name: Download the built APK
        if: env.token_present == 'true'
        run: |
          URL=$(jq -r '[.. | objects | (.applicationArchiveUrl // .buildUrl // empty)]
                       | map(select(. != null and . != "")) | .[0]' build.json)
          echo "Artifact URL: $URL"
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "Could not find APK URL in build output." >&2
            exit 1
          fi
          curl -L --fail -o whats-that-linux.apk "$URL"
          ls -la whats-that-linux.apk
          file whats-that-linux.apk || true

      - name: Upload APK as workflow artifact
        if: env.token_present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: whats-that-linux-apk
          path: whats-that-linux.apk
          if-no-files-found: error

      # Phone-friendly direct download link that always points at the newest build.
      - name: Publish APK to a rolling GitHub Release
        if: env.token_present == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest APK
          prerelease: true
          files: whats-that-linux.apk
          body: |
            Built on EAS from commit `${{ github.sha }}` and published here for a
            direct download. Install `whats-that-linux.apk` on your Android phone.
