name: Build APK

# Builds the installable APK directly on GitHub's runners (Android SDK
# preinstalled) on every push — fast, no third-party queue or build limits.
# Signed with the committed debug.keystore, so its signature matches every other
# build and the in-app updater installs over the top.
#
# Every branch gets a downloadable workflow artifact, but only the default
# branch publishes to the rolling `latest-apk` release: that release is what
# every installed app self-updates from, so a push to a feature branch must not
# be able to ship itself to users' phones.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # to publish the rolling release

# Merging and then syncing the working branch produces two pushes of the SAME
# commit seconds apart. Both used to resolve the full dependency graph at once,
# and Maven Central answered the second with 429 Too Many Requests, failing a
# build of code that had just succeeded. Serialise per commit so they never
# compete; cancel-in-progress stays false because the first of the pair is the
# default-branch run that publishes the release, and cancelling it would drop
# the update users are waiting for.
concurrency:
  group: build-apk-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Cache the Gradle/Maven artifacts. Without this every run re-resolved
          # the whole dependency graph from Maven Central, which is what earned
          # the 429 in the first place; a warm cache means the repeat build of an
          # already-built commit barely touches the network at all.
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Fetch proot engine binaries
        run: |
          chmod +x tools/fetch-proot.sh
          ./tools/fetch-proot.sh

      - name: Fetch virgl GPU server
        run: |
          chmod +x tools/fetch-virgl.sh
          ./tools/fetch-virgl.sh

      - name: Build full debug APK
        run: |
          chmod +x gradlew
          # Commit timestamp: the updater compares these to decide which of two
          # builds is newer. A SHA cannot express that ordering.
          BUILD_EPOCH="$(git show -s --format=%ct HEAD)"
          echo "BUILD_EPOCH=$BUILD_EPOCH" >> "$GITHUB_ENV"
          ./gradlew --no-daemon \
            -PgitSha="${{ github.sha }}" \
            -PbuildEpoch="$BUILD_EPOCH" \
            assembleFullDebug

      - name: Collect APK + version markers
        run: |
          cp app/build/outputs/apk/full/debug/app-full-debug.apk whats-that-linux.apk
          # version.txt stays a BARE SHA. Clients released before build-epoch.txt
          # compare this file's whole contents against their own SHA, so adding
          # anything here would make every one of them see a permanent mismatch
          # and re-prompt for the same update on every launch.
          echo -n "${{ github.sha }}" > version.txt
          echo -n "$BUILD_EPOCH" > build-epoch.txt
          ls -la whats-that-linux.apk version.txt build-epoch.txt

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: whats-that-linux-apk
          path: whats-that-linux.apk
          if-no-files-found: error

      - name: Publish APK to a rolling GitHub Release
        # Default branch only — see the note at the top of this file. Compared
        # against the repository's own default branch rather than a hardcoded
        # name, so renaming the branch can't silently re-open the hole.
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest APK
          prerelease: true
          files: |
            whats-that-linux.apk
            version.txt
            build-epoch.txt
          body: |
            Built on GitHub Actions from commit `${{ github.sha }}`.
            Install `whats-that-linux.apk`; the installed app self-updates from here.
