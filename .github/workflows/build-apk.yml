name: Build APK

# Builds a downloadable APK on every push. GitHub-hosted runners already carry
# the Android SDK and can reach Google's Maven, so the APK is produced here —
# no third-party build service or account required (keeps the pipeline
# decentralised and under your own repo's control).
on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the rolling pre-release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Fetch proot engine binaries
        run: |
          chmod +x tools/fetch-proot.sh
          ./tools/fetch-proot.sh

      - name: Build full + lite debug APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleFullDebug assembleLiteDebug

      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -la dist

      # Always available from the workflow run (Actions > run > Artifacts).
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whats-that-linux-apks
          path: dist/*.apk
          if-no-files-found: error

      # A stable, phone-friendly download link that always points at the newest
      # build of the default branch.
      - name: Publish rolling pre-release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref_name == 'claude/brainstorm-project-idea-xk1nt5'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-latest
          name: Latest CI build
          prerelease: true
          files: dist/*.apk
          body: |
            Automatically built APKs from the latest push (`${{ github.sha }}`).
            Download the `app-full-debug.apk` (XFCE) or `app-lite-debug.apk`
            (lightweight) and install on your phone.
