name: Build rootfs images

# Builds our OWN pre-configured rootfs image (arm64) via Docker + QEMU and
# publishes it to the 'images' release, so the app downloads a ready, tested
# image instead of installing on-device. Currently just the experimental Wine
# (Box64 + Wine) image; Ubuntu/Debian use their normal on-device install.
on:
  workflow_dispatch:
  push:
    paths:
      - 'images/**'
      - '.github/workflows/build-rootfs.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian-wine]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build arm64 rootfs (${{ matrix.image }})
        run: |
          docker buildx build --platform linux/arm64 \
            -t wt-${{ matrix.image }} --load images/${{ matrix.image }}
          docker create --platform linux/arm64 --name wt wt-${{ matrix.image }}
          # docker export gives us the container's filesystem = our rootfs.
          docker export wt | xz -T0 -6 > whatsthat-${{ matrix.image }}-arm64.tar.xz
          ls -la whatsthat-${{ matrix.image }}-arm64.tar.xz

      - name: Publish to the 'images' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: images
          name: Rootfs images
          prerelease: true
          files: whatsthat-${{ matrix.image }}-arm64.tar.xz
          body: |
            Pre-built, pre-configured rootfs images for What's that? — Linux.
            Built in CI from images/*, ready to download and run.
