# EAS Build custom build config for this NATIVE (non-React-Native) project.
# EAS normally runs Gradle inside an `android/` subdir; our Gradle project lives
# at the repo root, so each step sets working_directory accordingly.
#
# Produces a single installable APK (full XFCE profile) as the build artifact,
# so the artifact URL is a plain .apk the CI can download and publish.
build:
  name: Build What's that? — Linux (full debug APK)
  steps:
    - eas/checkout

    - run:
        name: Fetch proot engine binaries
        command: |
          chmod +x tools/fetch-proot.sh
          ./tools/fetch-proot.sh

    - run:
        name: Assemble full debug APK
        command: |
          chmod +x gradlew
          SHA="${EAS_BUILD_GIT_COMMIT_HASH:-$(git rev-parse HEAD 2>/dev/null || echo dev)}"
          echo "Building from commit $SHA"
          ./gradlew --no-daemon -PgitSha="$SHA" assembleFullDebug

    - eas/upload_artifact:
        name: Upload application archive
        inputs:
          path: app/build/outputs/apk/full/debug/app-full-debug.apk
