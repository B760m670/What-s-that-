name: Build APK

# Builds the installable APK directly on GitHub's runners (Android SDK
# preinstalled) on every push — fast, no third-party queue or build limits.
# Signed with the committed debug.keystore, so its signature matches every other
# build and the in-app updater installs over the top.
#
# Every branch gets a downloadable workflow artifact, but only a release branch
# publishes to the rolling `latest-apk` release: that release is what every
# installed app self-updates from, so a push to some other branch must not be
# able to ship itself to users' phones.
#
# The release branches are the repository's default branch and RELEASE_BRANCH
# below.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # to publish the rolling release

# Naming the working branch as a release branch is what removes the merge
# round-trip: development used to land on a branch, get merged to the default
# branch purely so the release job would run, and then be synced back — three
# pushes and two full builds for one change, when all the merge bought was
# passing that one condition.
env:
  RELEASE_BRANCH: claude/apk-artifacts-github-actions-rk0qxt

# One run per commit. This was added when merge-then-sync pushed the same commit
# twice within seconds and Maven Central answered the second run's dependency
# resolution with 429 Too Many Requests; that pattern is gone now, but the guard
# costs nothing and still covers a re-push of an identical commit.
# cancel-in-progress stays false: a cancelled run is a dropped release.
concurrency:
  group: build-apk-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Cache the Gradle/Maven artifacts. Without this every run re-resolved
          # the whole dependency graph from Maven Central, which is what earned
          # the 429 in the first place; a warm cache means the repeat build of an
          # already-built commit barely touches the network at all.
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Fetch proot engine binaries
        run: |
          chmod +x tools/fetch-proot.sh
          ./tools/fetch-proot.sh

      - name: Build full debug APK
        run: |
          chmod +x gradlew
          # Commit timestamp: the updater compares these to decide which of two
          # builds is newer. A SHA cannot express that ordering.
          BUILD_EPOCH="$(git show -s --format=%ct HEAD)"
          echo "BUILD_EPOCH=$BUILD_EPOCH" >> "$GITHUB_ENV"
          ./gradlew --no-daemon \
            -PgitSha="${{ github.sha }}" \
            -PbuildEpoch="$BUILD_EPOCH" \
            assembleFullDebug

      - name: Collect APK + version markers
        run: |
          cp app/build/outputs/apk/full/debug/app-full-debug.apk whats-that-linux.apk
          # version.txt stays a BARE SHA. Clients released before build-epoch.txt
          # compare this file's whole contents against their own SHA, so adding
          # anything here would make every one of them see a permanent mismatch
          # and re-prompt for the same update on every launch.
          echo -n "${{ github.sha }}" > version.txt
          echo -n "$BUILD_EPOCH" > build-epoch.txt
          ls -la whats-that-linux.apk version.txt build-epoch.txt

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: whats-that-linux-apk
          path: whats-that-linux.apk
          if-no-files-found: error

      - name: Publish APK to a rolling GitHub Release
        # Release branches only — see the note at the top of this file. The
        # default branch is read from the repository rather than hardcoded, so
        # renaming or switching it can't silently re-open the hole; naming a
        # second branch is deliberate, and it means a push there reaches phones
        # directly, with CI compiling it but nothing else standing in between.
        if: >-
          github.ref_name == github.event.repository.default_branch ||
          github.ref_name == env.RELEASE_BRANCH
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest APK
          prerelease: true
          files: |
            whats-that-linux.apk
            version.txt
            build-epoch.txt
          body: |
            Built on GitHub Actions from commit `${{ github.sha }}`.
            Install `whats-that-linux.apk`; the installed app self-updates from here.
